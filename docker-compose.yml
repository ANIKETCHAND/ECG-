version: "3.8"

services:
  ecg-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-ecg-hospital-platform
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - HOSPITAL_NAME=Apex Heart & Vascular Hospital
      - DEPARTMENT=Department of Cardiac Electrophysiology & Telemetry
      - FACILITY_ID=MED-FAC-2026-IND
      - ENVIRONMENT=production
      - DATA_PRIVACY_LEVEL=STRICT_CDSCO_MDR_2017
    volumes:
      - ecg-clinical-data:/app/data
      - ecg-clinical-reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  ecg-clinical-data:
    driver: local
  ecg-clinical-reports:
    driver: local
